# Downloads fresh data, recalculates everything and saves the results back into the repository.
# Runs on the 1st of every month, whenever the code changes, and on demand (Actions tab → "Atjaunot datus" → Run workflow).
name: Atjaunot datus

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 1 * *"
  push:
    branches: [main]
    paths: ["scripts/**", "config/**", "requirements.txt", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: atjaunot-datus
  cancel-in-progress: false

jobs:
  atjaunot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalēt bibliotēkas
        run: pip install -r requirements.txt
      - name: Lejupielādēt datus un pārrēķināt
        run: python scripts/run_all.py
      - name: Saglabāt rezultātus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Nav izmaiņu."
          else
            git commit -m "Atjaunoti dati $(date -u +%Y-%m-%d)"
            git push
          fi
